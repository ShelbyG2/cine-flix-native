name: Build and publish APKs to Telegram

# Builds both APKs and posts them to a Telegram chat/channel.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TMDB_API_KEY           TMDB key, written into local.properties for the build
#   KEYSTORE_BASE64        base64 of cineflix-release.keystore  (base64 -w0 file)
#   KEYSTORE_STORE_PASSWORD / KEYSTORE_KEY_ALIAS / KEYSTORE_KEY_PASSWORD
#   TELEGRAM_BOT_TOKEN     bot token from @BotFather (bot must be channel admin)
#   TELEGRAM_CHAT_ID       @channelname, or -100... for a private chat
#
# Run: push a tag (v1.0.1) or start it manually from the Actions tab.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the 'is this commit on master?' check can walk it.
          fetch-depth: 0

      # Releases only ever come from master: a tag must point at a commit that
      # master contains, and manual runs must target master. Anything else is
      # a branch experiment, not a stable build.
      - name: Only build commits that live on master
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            git fetch --no-tags origin master:refs/remotes/origin/master
            if ! git merge-base --is-ancestor "$sha" origin/master; then
              echo "::error::Tag $GITHUB_REF_NAME ($sha) is not reachable from master — refusing to publish an unstable build"
              exit 1
            fi
            echo "Tag $GITHUB_REF_NAME is on master — OK"
          else
            if [ "$GITHUB_REF_NAME" != "master" ]; then
              echo "::error::Manual runs must target master (got '$GITHUB_REF_NAME')"
              exit 1
            fi
            echo "Manual run on master — OK"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform (compileSdk 37)
        run: |
          # pipefail off: `yes` exits 141 (SIGPIPE) once sdkmanager stops reading.
          set +o pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0"

      # local.properties is gitignored, so CI recreates it (the secrets plugin
      # reads TMDB_API_KEY from it), and the keystore comes in as base64.
      - name: Write secrets, keystore and signing config
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TMDB_API_KEY" ]; then echo "::error::TMDB_API_KEY secret is not set"; exit 1; fi
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; fi
          printf 'sdk.dir=%s\nTMDB_API_KEY=%s\n' "$ANDROID_HOME" "$TMDB_API_KEY" > local.properties
          printf '%s' "$KEYSTORE_B64" | base64 -d > cineflix-release.keystore
          test -s cineflix-release.keystore || { echo "::error::keystore did not decode"; exit 1; }
          {
            echo "storeFile=cineflix-release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      # The release build silently falls back to unsigned if signing is not
      # picked up — refuse to publish such a build.
      - name: Verify the release APK is signed
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Send both APKs to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set"; exit 1
          fi
          for f in app/build/outputs/apk/debug/app-debug.apk \
                   app/build/outputs/apk/release/app-release.apk; do
            name="$(basename "$f")"
            resp="$(curl -fsS \
              -F "chat_id=$TELEGRAM_CHAT_ID" \
              -F "document=@$f" \
              -F "caption=CineFlix $VERSION — $name" \
              "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument")"
            case "$resp" in
              *'"ok":true'*) echo "sent $name" ;;
              *) echo "::error::Telegram rejected $name: $resp"; exit 1 ;;
            esac
          done
